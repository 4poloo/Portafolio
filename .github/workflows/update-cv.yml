name: Update portfolio CV binary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-cv.yml"

permissions:
  contents: write

jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update degree status in CV PDF
        run: |
          python -m pip install --quiet pymupdf
          python <<'PY'
          import os
          import fitz

          pdf_path = "public/Maximiliano_Olave_CV_2026_Actualizado.pdf"
          old = "Egresado - Trabajo de título / defensa en proceso"
          new = "Titulado - 2026 | Trabajo de título aprobado con nota 7,0"

          doc = fitz.open(pdf_path)
          changed = False

          for page in doc:
              matches = page.search_for(old)
              if not matches:
                  continue

              rect = matches[0]
              origin_y = rect.y1 - 2.4905
              redact = fitz.Rect(rect.x0 - 1, rect.y0 - 1, 340, rect.y1 + 1)
              page.add_redact_annot(redact, fill=(1, 1, 1))
              page.apply_redactions()
              page.insert_text(
                  (rect.x0, origin_y),
                  new,
                  fontsize=8.5,
                  fontname="Times-Roman",
                  color=(95 / 255, 95 / 255, 100 / 255),
              )
              changed = True
              break

          if changed:
              tmp_path = pdf_path + ".tmp.pdf"
              doc.save(tmp_path, garbage=4, deflate=True)
              doc.close()
              os.replace(tmp_path, pdf_path)
          else:
              doc.close()
              print("Degree status was already updated; no PDF change required.")
          PY
      - name: Verify PDF status
        run: |
          python <<'PY'
          import fitz
          path = "public/Maximiliano_Olave_CV_2026_Actualizado.pdf"
          text = "\n".join(page.get_text() for page in fitz.open(path))
          assert "Titulado - 2026 | Trabajo de título aprobado con nota 7,0" in text
          assert "Egresado - Trabajo de título / defensa en proceso" not in text
          print("CV verification passed")
          PY
      - name: Commit updated CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Maximiliano_Olave_CV_2026_Actualizado.pdf
          if git diff --cached --quiet; then
            echo "CV already up to date"
            exit 0
          fi
          git commit -m "Update final CV after degree completion"
          git push
