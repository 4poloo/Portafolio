name: Finalize CV PDF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Stage final CV binary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild final CV
        shell: bash
        run: |
          cat .cv-upload/part1 .cv-upload/part2 .cv-upload/part3 .cv-upload/part4 .cv-upload/part5 > public/Maximiliano_Olave_CV_2026_Actualizado.pdf
          test "$(stat -c%s public/Maximiliano_Olave_CV_2026_Actualizado.pdf)" = "54135"
          echo "30397efe3a18eeec3c55a85679d3a626b2281bf04e4f82da98e8b30472595947  public/Maximiliano_Olave_CV_2026_Actualizado.pdf" | sha256sum -c -
      - name: Commit final CV and clean staging files
        shell: bash
        run: |
          rm -rf .cv-upload
          rm -f .github/workflows/finalize-cv.yml
          git config user.name "Max Olave"
          git config user.email "130632064+4poloo@users.noreply.github.com"
          git add -A
          git commit -m "Update portfolio with final CV"
          git push
